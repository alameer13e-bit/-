<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامج المذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEBFA; --surface:#FFFFFF; --ink:#2A1F4D; --muted:#6F6590;
  --line:#DCD5F0; --accent:#7A5CF0; --accent-ink:#FFFFFF; --good:#2FAE8C; --warm:#FF8F6B;
  --soft:#F6F3FD;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1A1530; --surface:#251E42; --ink:#F1EDFF; --muted:#A79DCB; --line:#3A3160; --accent:#9B84FF; --accent-ink:#1A1530; --good:#4CD3AE; --warm:#FF9E7E; --soft:#2D2550; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;padding-bottom:88px}
header{padding:22px 18px 8px;max-width:640px;margin:0 auto}
header h1{margin:0;font-size:26px;font-weight:800}
header p{margin:2px 0 0;color:var(--muted);font-size:15px}
main{max-width:640px;margin:0 auto;padding:8px 14px}
section{display:none}
section.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:18px;font-weight:700}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:8px 4px;border-radius:12px;cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent);font-weight:700}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
button.btn.ghost{background:var(--soft);color:var(--ink)}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1}
/* timer */
.timer{text-align:center}
.time{font-size:68px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;direction:ltr}
.mode{color:var(--muted);font-weight:500;margin-bottom:4px}
.ring{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:12px 0 16px}
.ring i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s linear}
.timer.rest .ring i{background:var(--good)}
.timer .row{justify-content:center}
.count{margin-top:12px;color:var(--muted);font-size:15px}
/* lists */
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li.item:last-child{border-bottom:0}
li.item label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
li.item.done span.t{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
.chip{background:var(--soft);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);padding:6px 0}
.day{margin:14px 0 4px;font-weight:800;color:var(--accent)}
.exam{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.exam:last-child{border-bottom:0}
.exam .n{flex:1;font-weight:700}
.days{min-width:64px;text-align:center;border-radius:12px;padding:6px 8px;background:var(--soft);font-weight:800}
.days small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.days.soon{background:var(--warm);color:#2A1F4D}
.days.soon small{color:#2A1F4D}
.sub{display:flex;gap:8px;flex-wrap:wrap}
.sub .chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--ink)}
.note{color:var(--muted);font-size:14px;margin:8px 2px}
@media (prefers-reduced-motion: reduce){.ring i{transition:none}}
</style>
</head>
<body>
<header>
  <h1 id="hello">برنامج المذاكرة</h1>
  <p id="today"></p>
</header>

<main>
  <!-- اليوم -->
  <section id="s-today" class="on">
    <div class="card timer" id="timerCard">
      <div class="mode" id="mode">وقت المذاكرة</div>
      <div class="time" id="time">25:00</div>
      <div class="ring"><i id="bar"></i></div>
      <div class="row">
        <select id="timerSub" aria-label="المادة"></select>
        <button class="btn" id="startBtn">ابدأ</button>
        <button class="btn ghost" id="resetBtn">إعادة</button>
      </div>
      <div class="count" id="count"></div>
    </div>

    <div class="card">
      <h2>مذاكرة اليوم</h2>
      <ul id="todaySlots"></ul>
    </div>

    <div class="card">
      <h2>مهامي</h2>
      <div class="row">
        <input id="taskIn" placeholder="مثلاً: حل تمارين الوحدة ٣" aria-label="مهمة جديدة">
        <button class="btn" id="taskAdd">إضافة</button>
      </div>
      <ul id="tasks"></ul>
    </div>
  </section>

  <!-- الجدول -->
  <section id="s-week">
    <div class="card">
      <h2>إضافة حصة مذاكرة</h2>
      <div class="row">
        <select id="wDay" aria-label="اليوم"></select>
        <select id="wSub" aria-label="المادة"></select>
        <input id="wTime" type="time" aria-label="الوقت" style="flex:none">
        <button class="btn" id="wAdd">إضافة</button>
      </div>
    </div>
    <div id="week"></div>
  </section>

  <!-- الاختبارات -->
  <section id="s-exams">
    <div class="card">
      <h2>إضافة اختبار</h2>
      <div class="row">
        <select id="eSub" aria-label="المادة"></select>
        <input id="eDate" type="date" aria-label="تاريخ الاختبار" style="flex:none">
        <button class="btn" id="eAdd">إضافة</button>
      </div>
    </div>
    <div class="card"><h2>الاختبارات القادمة</h2><div id="exams"></div></div>
  </section>

  <!-- المواد -->
  <section id="s-subjects">
    <div class="card">
      <h2>موادي</h2>
      <div class="row">
        <input id="subIn" placeholder="اسم مادة جديدة" aria-label="مادة جديدة">
        <button class="btn" id="subAdd">إضافة</button>
      </div>
      <div class="sub" id="subs" style="margin-top:12px"></div>
    </div>
    <p class="note">البيانات محفوظة في هذا الجهاز والمتصفح فقط.</p>
  </section>
</main>

<nav>
  <button data-t="today" class="on">اليوم</button>
  <button data-t="week">الجدول</button>
  <button data-t="exams">الاختبارات</button>
  <button data-t="subjects">المواد</button>
</nav>

<script>
(function(){
  var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  var KEY="studyPlanner.v1";
  var S={subjects:["اللغة العربية","اللغة الإنجليزية","الرياضيات","العلوم","الاجتماعيات","التربية الإسلامية"],slots:[],tasks:[],exams:[],pomos:{}};
  try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw));}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  function $(id){return document.getElementById(id);}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function dkey(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

  var now=new Date();
  $("today").textContent=now.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"});

  /* tabs */
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x===b);});
      document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id==="s-"+b.dataset.t);});
      window.scrollTo(0,0);
    };
  });

  /* selects */
  function fillSelects(){
    ["timerSub","wSub","eSub"].forEach(function(id){
      var s=$(id),cur=s.value;s.textContent="";
      if(id==="timerSub"){var o=el("option",null,"بدون مادة");o.value="";s.appendChild(o);}
      S.subjects.forEach(function(n){var o=el("option",null,n);o.value=n;s.appendChild(o);});
      if(cur)s.value=cur;
    });
    var w=$("wDay");if(!w.options.length){DAYS.forEach(function(d,i){var o=el("option",null,d);o.value=i;w.appendChild(o);});w.value=now.getDay();}
  }

  /* subjects */
  function renderSubjects(){
    var box=$("subs");box.textContent="";
    S.subjects.forEach(function(n){
      var c=el("span","chip",n);
      var x=el("button","x","×");x.setAttribute("aria-label","حذف "+n);
      x.onclick=function(){S.subjects=S.subjects.filter(function(s){return s!==n;});save();renderAll();};
      c.appendChild(x);box.appendChild(c);
    });
  }
  $("subAdd").onclick=function(){
    var v=$("subIn").value.trim();if(!v||S.subjects.indexOf(v)>-1)return;
    S.subjects.push(v);$("subIn").value="";save();renderAll();
  };

  /* slots */
  function slotItem(s){
    var li=el("li","item"+(s.done?" done":""));
    var lb=el("label");var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!s.done;
    cb.onchange=function(){s.done=cb.checked;save();renderAll();};
    lb.appendChild(cb);lb.appendChild(el("span","t",s.subject));
    li.appendChild(lb);
if(s.time)li.appendChild(el("span","chip",
  (+s.time.slice(0,2)%12||12)+s.time.slice(2)+
  (+s.time.slice(0,2)>=12?" م":" ص")));
    var x=el("button","x","×");x.setAttribute("aria-label","حذف الحصة");
    x.onclick=function(){S.slots=S.slots.filter(function(q){return q.id!==s.id;});save();renderAll();};
    li.appendChild(x);return li;
  }
  function sortSlots(a,b){return (a.time||"99:99")<(b.time||"99:99")?-1:1;}
  function renderSlots(){
    var t=$("todaySlots");t.textContent="";
    var td=S.slots.filter(function(s){return +s.day===now.getDay();}).sort(sortSlots);
    if(!td.length){t.appendChild(el("li","empty","ما في حصص اليوم. أضيفيها من تبويب الجدول."));}
    td.forEach(function(s){t.appendChild(slotItem(s));});
    var w=$("week");w.textContent="";
    for(var i=0;i<7;i++){
      var list=S.slots.filter(function(s){return +s.day===i;}).sort(sortSlots);
      if(!list.length)continue;
      var card=el("div","card");card.appendChild(el("div","day",DAYS[i]));
      var ul=el("ul");list.forEach(function(s){ul.appendChild(slotItem(s));});
      card.appendChild(ul);w.appendChild(card);
    }
    if(!w.children.length){var c=el("div","card");c.appendChild(el("div","empty","الجدول فاضي. أضيفي أول حصة من فوق."));w.appendChild(c);}
  }
  $("wAdd").onclick=function(){
    S.slots.push({id:uid(),day:+$("wDay").value,subject:$("wSub").value,time:$("wTime").value,done:false});
    save();renderAll();
  };

  /* tasks */
  function renderTasks(){
    var ul=$("tasks");ul.textContent="";
    if(!S.tasks.length)ul.appendChild(el("li","empty","ما في مهام."));
    S.tasks.forEach(function(k){
      var li=el("li","item"+(k.done?" done":""));
      var lb=el("label");var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!k.done;
      cb.onchange=function(){k.done=cb.checked;save();renderTasks();};
      lb.appendChild(cb);lb.appendChild(el("span","t",k.text));li.appendChild(lb);
      var x=el("button","x","×");x.setAttribute("aria-label","حذف المهمة");
      x.onclick=function(){S.tasks=S.tasks.filter(function(q){return q.id!==k.id;});save();renderTasks();};
      li.appendChild(x);ul.appendChild(li);
    });
  }
  function addTask(){var v=$("taskIn").value.trim();if(!v)return;S.tasks.unshift({id:uid(),text:v,done:false});$("taskIn").value="";save();renderTasks();}
  $("taskAdd").onclick=addTask;
  $("taskIn").addEventListener("keydown",function(e){if(e.key==="Enter")addTask();});

  /* exams */
  function renderExams(){
    var box=$("exams");box.textContent="";
    var today=new Date();today.setHours(0,0,0,0);
    var list=S.exams.slice().sort(function(a,b){return a.date<b.date?-1:1;});
    if(!list.length)box.appendChild(el("div","empty","ما في اختبارات مضافة."));
    list.forEach(function(x){
      var d=new Date(x.date+"T00:00:00");var diff=Math.round((d-today)/86400000);
      var row=el("div","exam");row.appendChild(el("div","n",x.subject));
      var b=el("div","days"+(diff>=0&&diff<=3?" soon":""));
      if(diff<0){b.textContent="مضى";}
      else if(diff===0){b.textContent="اليوم";}
      else{b.textContent=diff;b.appendChild(el("small",null,diff===1?"يوم":"أيام"));}
      row.appendChild(b);
      var rm=el("button","x","×");rm.setAttribute("aria-label","حذف الاختبار");
      rm.onclick=function(){S.exams=S.exams.filter(function(q){return q.id!==x.id;});save();renderExams();};
      row.appendChild(rm);box.appendChild(row);
    });
  }
  $("eAdd").onclick=function(){
    var d=$("eDate").value;if(!d)return;
    S.exams.push({id:uid(),subject:$("eSub").value,date:d});save();renderExams();
  };

  /* pomodoro */
  var WORK=25*60,REST=5*60,phase="work",left=WORK,total=WORK,tick=null;
  function fmt(n){var m=Math.floor(n/60),s=n%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  function drawTimer(){
    $("time").textContent=fmt(left);
    $("bar").style.width=(100*(total-left)/total)+"%";
    $("mode").textContent=phase==="work"?"وقت المذاكرة":"وقت الراحة";
    $("timerCard").classList.toggle("rest",phase==="rest");
    $("startBtn").textContent=tick?"إيقاف مؤقت":"ابدأ";
    var n=S.pomos[dkey(now)]||0;
    $("count").textContent=n?("جلسات اليوم: "+n+" ("+(n*25)+" دقيقة)"):"ابدئي أول جلسة اليوم";
    document.title=tick?fmt(left)+" · برنامج المذاكرة":"برنامج المذاكرة";
  }
  function beep(){
    try{var a=new (window.AudioContext||window.webkitAudioContext)();var o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.15;o.start();o.stop(a.currentTime+.4);}catch(e){}
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }
  function step(){
    left--;
    if(left<=0){
      beep();
      if(phase==="work"){S.pomos[dkey(now)]=(S.pomos[dkey(now)]||0)+1;save();phase="rest";total=left=REST;}
      else{phase="work";total=left=WORK;}
      clearInterval(tick);tick=null;
    }
    drawTimer();
  }
  $("startBtn").onclick=function(){
    if(tick){clearInterval(tick);tick=null;}else{tick=setInterval(step,1000);}
    drawTimer();
  };
  $("resetBtn").onclick=function(){clearInterval(tick);tick=null;phase="work";total=left=WORK;drawTimer();};

  function renderAll(){fillSelects();renderSubjects();renderSlots();renderTasks();renderExams();drawTimer();}
  renderAll();
})();
</script>
</body>
</html>
